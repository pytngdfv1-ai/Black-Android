name: Black Web - Prueba inicial

on:
  workflow_dispatch:
  push:
    branches:
      - web-port
    paths:
      - "web-probe/**"
      - ".github/workflows/web-probe.yml"

permissions:
  contents: read

jobs:
  build-web-probe:
    name: Compilar prueba WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Verificar compilador
        run: emcc --version

      - name: Compilar prueba web
        run: |
          mkdir -p dist
          emcc web-probe/main.cpp \
            -O2 \
            -sALLOW_MEMORY_GROWTH=1 \
            --shell-file web-probe/shell.html \
            -o dist/index.html

      - name: Publicar artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: black-web-probe
          path: dist/
          if-no-files-found: error
          retention-days: 7
