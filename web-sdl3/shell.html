
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no">
  <title>BLACK - Prueba SDL3</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #101114;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px;
      background: #1a1c20;
      border-bottom: 1px solid #333;
    }

    header strong {
      display: block;
      font-size: 19px;
    }

    header span {
      display: block;
      margin-top: 6px;
      color: #bbb;
      font-size: 13px;
    }

    #estado {
      padding: 10px 14px;
      color: #a8e6a3;
      font-size: 13px;
    }

    #zona {
      flex: 1;
      min-height: 0;
      padding: 8px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: #18202e;
      touch-action: none;
    }

    #salida {
      max-height: 100px;
      overflow: auto;
      margin: 0;
      padding: 10px;
      background: #17181b;
      color: #ddd;
      white-space: pre-wrap;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <strong>BLACK — prueba de compatibilidad</strong>
    <span>
      Esta prueba comprueba SDL3 en el navegador.
      Todavía no contiene el juego.
    </span>
  </header>

  <div id="estado">Iniciando la prueba…</div>

  <div id="zona">
    <canvas id="canvas"></canvas>
  </div>

  <pre id="salida"></pre>

  <script>
    var estado = document.getElementById("estado");
    var salida = document.getElementById("salida");

    var Module = {
      canvas: document.getElementById("canvas"),

      print: function(mensaje) {
        salida.textContent += mensaje + "\n";
        salida.scrollTop = salida.scrollHeight;

        if (mensaje.indexOf(
          "SDL3 se inicio correctamente"
        ) !== -1) {
          estado.textContent =
            "SDL3 funciona. Prueba tocar o hacer clic.";
        }
      },

      printErr: function(mensaje) {
        salida.textContent += "Aviso: " + mensaje + "\n";
      },

      setStatus: function(mensaje) {
        if (mensaje) {
          estado.textContent = mensaje;
        }
      },

      onRuntimeInitialized: function() {
        estado.textContent =
          "WebAssembly iniciado. Comprobando SDL3…";
      }
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
